.panel{position:relative;margin-top:-40px;background:var(--panel);border-radius:50% 50% 0 0 / 44px 44px 0 0;padding:60px 18px 26px}
.avatar{position:absolute;left:50%;top:-48px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:#14332d;border:5px solid #fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.avatar img{height:52px;width:auto;display:block}
h1{font-weight:800;font-size:clamp(18px,5.8vw,26px);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;line-height:1.1}
h1 span{display:block;font-size:1.9em;letter-spacing:.03em;padding-left:.03em;color:var(--c3);margin-top:6px;line-height:1}
.sub{font-size:12.5px;font-weight:400;color:var(--muted);margin-top:14px;line-height:1.5;text-wrap:balance}
.list{display:flex;flex-direction:column;gap:14px;margin-top:24px;text-align:left}
a.card{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;text-decoration:none;
  background:var(--bg-c);color:var(--fg-c);position:relative;overflow:hidden;
  box-shadow:0 10px 24px -14px rgba(20,51,45,.55);transition:transform .25s ease,box-shadow .25s ease}
a.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 28px -14px rgba(20,51,45,.6);outline:none}
a.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.k1{--bg-c:var(--c1);--fg-c:var(--c1t)}
.k2{--bg-c:var(--c2);--fg-c:var(--c2t)}
.k3{--bg-c:var(--c3);--fg-c:var(--c3t)}
.k4{--bg-c:var(--c4);--fg-c:var(--c4t)}
.ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;opacity:.92;position:relative;z-index:1}
.ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1 1 0;min-width:0;position:relative;z-index:1}
.tx small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-bottom:5px}
.tx b{font-weight:400;font-size:16px;line-height:1.3;letter-spacing:.01em}
.ar{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;position:relative;z-index:1;opacity:.9}
.ar svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:34px;text-align:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
</style>
</head>

<main class="wrap">
  <header class="hero">
